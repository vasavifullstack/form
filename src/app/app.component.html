
<!-- ngForm applied only once -->
<form #userform="ngForm" (ngSubmit)="onSubmit(userform)">
  
  <!-- USERNAME -->
  <div class="form-group">
    <label>User Name *</label>
    <input
      type="text"
      name="username"
      class="form-control"
      placeholder="Name of the user"
      [(ngModel)]="user.username"
      required
      #username="ngModel"
    />
    <span style="color:red"
    *ngIf="username.dirty && username.invalid">
  please enter the username</span>
</div>


<div class="form-group">
  <label>Email *</label>
  <input type="email" 
  name=useremail
  class="form-control"
  placeholder="Enter your email"
  [(ngModel)]="user.email" 
  #useremail="ngModel"
  pattern="^[a-z]+(\.[a-z]+[0-9]*)?@tcs\.com$"
  email
  required>
</div>
<span style="color:red"
*ngIf="useremail.dirty&& useremail.invalid">Please enter the usermail</span>
<span style="color:red"
*ngIf="useremail.dirty && useremail.errors?.['email']">please enter proper mail</span>
<div class="form-group">
    <label>Password *</label>
    <input type="password" class="form-control" placeholder="enter the password" required>
</div>
<label for="number">Mobile no *</label>
<input 
id="number"
type="text"
name="usernum"
class="form-control"
placeholder="enter the mobile number"
[(ngModel)]="user.usernum"
#usernum="ngModel"
pattern="[0-9]{10}"
required
/>
<span style="color:red"
*ngIf="usernum.dirty && usernum.errors?.['required']">please enter the number</span>
<br>
<span style="color:red"
*ngIf="usernum.dirty && usernum.errors?.['pattern']">please enter numbers only</span>

  <button type="submit" class="btn btn-primary" [disabled]="userform.invalid">
    Register
  </button>
